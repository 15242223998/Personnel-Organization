# 局域网平板投票部署示例（Nginx）
# 前置：1) personnel-frontend 执行 npm run build 生成 dist
#       2) 后端以 spring-boot:run 运行在 127.0.0.1:8080（或将 -Dserver.port 换成实际端口）
# 用法：修改下面 root 指向真实 dist 绝对路径后，
#       nginx -c <本文件绝对路径> -p <nginx安装目录>  （Windows）
#       nginx -t && nginx            （Linux/macOS，conf 放 conf.d 或改为 server 段）
# 平板访问：http://<本机局域网IP>/           桌面后台
#           http://<本机局域网IP>/tablet      平板投票页

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # 平板签字图最大放宽到 5MB
    client_max_body_size 5m;

    server {
        listen       80;
        server_name  localhost;

        # Vue3 history 路由：找不到文件回退 index.html
        location / {
            root   C:/Users/Administrator/Desktop/Git-Project/Personnel-Organization-Project/personnel-frontend/dist;
            index  index.html;
            try_files $uri $uri/ /index.html;
        }

        # 后端接口同源反代（前端请求前缀 /api）
        location /api/ {
            proxy_pass         http://127.0.0.1:8080;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
